<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Промокоды для путешественников</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --sand: #F5EDD8; --deep: #1A2E35; --ocean: #1B6CA8;
    --coral: #E8603C; --gold: #D4A843; --mint: #4ABFAD; --light: #FDFAF4;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: var(--light); color: var(--deep); }

  header { background: var(--deep); padding: 0 40px; position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; height: 64px; box-shadow: 0 2px 20px rgba(0,0,0,0.3); }
  .logo { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--sand); }
  .logo span { color: var(--gold); }
  .header-tag { font-size: 12px; color: var(--mint); letter-spacing: 2px; text-transform: uppercase; }

  .hero { background: var(--deep); padding: 64px 40px 72px; position: relative; overflow: hidden; }
  .hero::before { content: ''; position: absolute; top: -60px; right: -80px; width: 500px; height: 500px; border-radius: 50%; background: radial-gradient(circle, rgba(27,108,168,0.25) 0%, transparent 70%); }
  .hero::after { content: '✈'; position: absolute; right: 60px; bottom: 20px; font-size: 160px; opacity: 0.04; color: var(--sand); line-height: 1; }
  .hero-inner { max-width: 960px; margin: 0 auto; position: relative; }
  .eyebrow { display: inline-block; background: var(--coral); color: #fff; font-size: 11px; font-weight: 500; letter-spacing: 2.5px; text-transform: uppercase; padding: 5px 14px; border-radius: 2px; margin-bottom: 20px; }
  .hero h1 { font-family: 'Playfair Display', serif; font-size: clamp(32px, 5vw, 54px); font-weight: 900; color: var(--sand); line-height: 1.12; margin-bottom: 16px; }
  .hero h1 em { font-style: normal; color: var(--gold); }
  .hero-sub { font-size: 16px; color: rgba(245,237,216,0.65); font-weight: 300; max-width: 520px; line-height: 1.6; margin-bottom: 32px; }
  .hero-note { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; padding: 10px 16px; font-size: 13px; color: rgba(245,237,216,0.7); }
  .hero-note strong { color: var(--mint); }

  .filters { background: var(--sand); padding: 14px 40px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid rgba(26,46,53,0.1); position: sticky; top: 64px; z-index: 90; }
