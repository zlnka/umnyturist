<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Промокоды для путешественников</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --sand: #F5EDD8; --deep: #1A2E35; --ocean: #1B6CA8;
    --coral: #E8603C; --gold: #D4A843; --mint: #4ABFAD; --light: #FDFAF4;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: var(--light); color: var(--deep); }

  header { background: var(--deep); padding: 0 40px; position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; height: 64px; box-shadow: 0 2px 20px rgba(0,0,0,0.3); }
  .logo { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--sand); }
  .logo span { color: var(--gold); }
  .header-tag { font-size: 12px; color: var(--mint); letter-spacing: 2px; text-transform: uppercase; }

  .hero { background: var(--deep); padding: 64px 40px 72px; position: relative; overflow: hidden; }
  .hero::before { content: ''; position: absolute; top: -60px; right: -80px; width: 500px; height: 500px; border-radius: 50%; background: radial-gradient(circle, rgba(27,108,168,0.25) 0%, transparent 70%); }
  .hero::after { content: '✈'; position: absolute; right: 60px; bottom: 20px; font-size: 160px; opacity: 0.04; color: var(--sand); line-height: 1; }
  .hero-inner { max-width: 960px; margin: 0 auto; position: relative; }
  .eyebrow { display: inline-block; background: var(--coral); color: #fff; font-size: 11px; font-weight: 500; letter-spacing: 2.5px; text-transform: uppercase; padding: 5px 14px; border-radius: 2px; margin-bottom: 20px; }
  .hero h1 { font-family: 'Playfair Display', serif; font-size: clamp(32px, 5vw, 54px); font-weight: 900; color: var(--sand); line-height: 1.12; margin-bottom: 16px; }
  .hero h1 em { font-style: normal; color: var(--gold); }
  .hero-sub { font-size: 16px; color: rgba(245,237,216,0.65); font-weight: 300; max-width: 520px; line-height: 1.6; margin-bottom: 32px; }
  .hero-note { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; padding: 10px 16px; font-size: 13px; color: rgba(245,237,216,0.7); }
  .hero-note strong { color: var(--mint); }

  .filters { background: var(--sand); padding: 14px 40px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid rgba(26,46,53,0.1); position: sticky; top: 64px; z-index: 90; }
  .fl { font-size: 12px; color: rgba(26,46,53,0.5); letter-spacing: 1px; text-transform: uppercase; margin-right: 4px; white-space: nowrap; }
  .fb { background: #fff; border: 1.5px solid rgba(26,46,53,0.15); color: var(--deep); font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500; padding: 6px 13px; border-radius: 30px; cursor: pointer; transition: all 0.2s; }
  .fb:hover, .fb.active { background: var(--deep); color: var(--sand); border-color: var(--deep); }

  main { max-width: 1140px; margin: 0 auto; padding: 44px 40px 80px; }
  .sec-title { font-family: 'Playfair Display', serif; font-size: 13px; letter-spacing: 3px; text-transform: uppercase; color: rgba(26,46,53,0.4); margin-bottom: 24px; display: flex; align-items: center; gap: 14px; }
  .sec-title::after { content: ''; flex: 1; height: 1px; background: rgba(26,46,53,0.1); }

  /* PROMO CARDS */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
  .card { background: #fff; border-radius: 14px; overflow: hidden; border: 1.5px solid rgba(26,46,53,0.07); transition: transform 0.25s, box-shadow 0.25s; display: flex; flex-direction: column; }
  .card:hover { transform: translateY(-4px); box-shadow: 0 18px 44px rgba(26,46,53,0.11); }
  .card.no-promo { border-style: dashed; background: rgba(255,255,255,0.6); }
  .accent { height: 5px; }
  .body { padding: 18px 20px 14px; flex: 1; display: flex; flex-direction: column; }
  .ch{ display: flex; align-items: flex-start; justify-content: space-between; nmargin-bottom: 14px; }
  .pi { display: flex; align-items: center; gap: 10px; }
  .plogo { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  .pname { font-family: 'Playfair Display', serif; font-size: 15px; font-weight: 700; color: var(--deep); }
  .pcat { font-size: 11px; color: rgba(26,46,53,0.45); margin-top: 2px; }
  .badge { font-size: 10px; font-weight: 600; padding: 3px 7px; border-radius: 4px; flex-shrink: 0; }
  .badge-hot { background: var(--coral); color: #fff; }
  .badge-new { background: var(--mint); color: #fff; }
  .code-block { background: var(--deep); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .code-label { font-size: 10px; color: rgba(245,237,216,0.45); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 4px; }
  .code-val { font-family: monospace; font-size: 18px; font-weight: 700; color: var(--gold); letter-spacing: 2px; }
  .copy-btn { background: var(--gold); color: var(--deep); border: none; font-size: 12px; font-weight: 700; padding: 8px 14px; border-radius:7px; cursor: pointer; }
  .nocode-block { background: rgba(26,46,53,0.04); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; }
  .discount-tag { display: inline-block; background: #FEF3C7; color: #92400E;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;margin-bottom:10px; }
  .conds { font-size: 12px; color: rgba(26,46,53,0.55); line-height: 1.5; margin-bottom: 14px; flex: 1; }
  .cf { display: flex; align-items: center; justify-content: space-between; padding-top: 11px; border-top: 1px solid rgba(26,46,53,0.07); }
  .go { display: inline-flex; align-items: center; gap: 5px; background: var(--ocean); color: #fff; font-size: 12px; font-weight: 500; padding: 7px 14px; border-radius: 8px; text-decoration: none; }
  footer { background: var(--deep); color: rgba(245,237,216,0.45); text-align: center; padding: 28px 40px; font-size: 13px; }
  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--deep); color: var(--mint); padding: 12px 24px; border-radius: 30px; font-size:14px; display:none; }
</style>
</head>
<body>
<header><div class="logo">tur<span>promo</span></div><div class="header-tag">Актуальные промокоды</div></header>
<section class="hero"><div class="hero-inner"><div class="eyebrow">Только проверенные сервисы</div><h1>Промокоды на<br><em>путешествия</em></h1><p class="hero-sub">Актуальные промокоды специальных сервисов от партнерских.</p></div></section>
<div class="filters"><span class="fl">Категория:</span><button class="fb active" onclick="f('all',this)">Все</button><button class="fb" onclick="f('авиа',this)">✈ Авиа</button><button class="fb" onclick="f('жд',this)">🚂 ЖД</button><button class="fb" onclick="f('отели',this)">🏨 Отели</button><button class="fb" onclick="f('страховки',this)">🛡 страховки</button><button class="fb" onclick="f('экскурсии',this)">🗺 эBскурсии</button><button class="fb" onclick="f('симки',this)">📱 связь</button><button class="fb" onclick="f('туры',this)">🏖 тtры</button></div>
<main><div class="sec-title">Актуальные предложения</div><div class="grid" id="grid">
